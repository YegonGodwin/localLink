version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: locallink-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=localLink
    networks:
      - locallink-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: locallink-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Override MongoDB URI to use container name
      - MONGO_URI=mongodb://mongodb:27017/localLink
      # Override recommendation service URL
      - RECOMMENDATION_SERVICE_URL=http://recommendation:8001
    depends_on:
      - mongodb
    networks:
      - locallink-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: locallink-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - locallink-network

  # Recommendation Service
  recommendation:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    container_name: locallink-recommendation
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - locallink-network

networks:
  locallink-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
